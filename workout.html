<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1117"><title>운동 그래프 | 마웨그</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/workout.css"></head><body>
<header class="top-bar"><div></div><a href="index.html?select=1" class="mweg-header-wrap" style="justify-self:center"><span class="mweg-title">마웨그</span><span class="mweg-subtitle">My Weight Graph</span></a><div style="display:flex;justify-content:flex-end"><a class="btn btn-ghost btn-sm" href="index.html?select=1">사용자 변경</a></div></header>
<main class="page workout-page"><div class="wo-toolbar"><div><h1>운동 그래프</h1><small>운동 기록을 살펴보고 지난 기록을 수정합니다.</small></div><div class="wo-actions"><button class="btn btn-ghost btn-sm" id="inbodyBtn">내 데이터</button></div></div><div class="wo-tabs"><button class="active" data-range="7">최근 7일</button><button data-range="28">28일</button><button data-range="90">3개월</button><button data-range="all">전체</button></div><section id="workoutContent"><div class="loading"><div class="spinner"></div></div></section></main>
<nav class="bottom-nav" id="bottomNav"></nav><div class="toast" id="toast"></div>
<div class="wo-modal" id="workoutModal" hidden><form class="wo-sheet" id="workoutForm"><div class="wo-sheet-head"><div><b>운동 기록</b><div class="wo-draft" id="draftState">자동 임시저장</div></div><button type="button" data-close>×</button></div><div class="wo-kind"><button type="button" class="active" data-kind="strength">🏋️ 웨이트</button><button type="button" data-kind="running">🏃 러닝</button></div><div class="wo-fields"><div class="wo-field"><label>운동 날짜</label><input type="date" id="sessionDay" required></div><div class="wo-field"><label>헬스장</label><select id="gymSelect"></select></div></div><section id="strengthEditor"><input class="exercise-search" id="exerciseSearch" placeholder="운동 이름 또는 부위 검색"><div class="exercise-picker" id="exercisePicker"></div><div id="exerciseBlocks"></div></section><section id="runningEditor" hidden><div class="wo-fields" style="margin-top:12px"><div class="wo-field"><label>거리 km</label><input type="number" step="0.01" min="0" id="runDistance"></div><div class="wo-field"><label>운동 시간</label><input type="time" step="1" id="runDuration"></div><div class="wo-field"><label>케이던스 · 선택</label><input type="number" min="0" id="runCadence"></div><div class="wo-field"><label>환경</label><select id="runEnvironment"><option value="outdoor">야외</option><option value="treadmill">트레드밀</option></select></div><div class="wo-field"><label>평균 페이스</label><input id="runPace" readonly placeholder="자동 계산"></div></div></section><button type="button" class="wo-note-toggle" id="noteToggle">+ 운동 메모</button><div class="wo-field" id="noteWrap" hidden><textarea id="sessionNote" rows="2" placeholder="필요할 때만 남겨보세요"></textarea></div><div class="wo-field" style="margin-top:10px"><label>오늘 체감 강도 · 선택</label><div class="intensity" id="intensity"><button type="button" data-v="1">가벼움</button><button type="button" data-v="2">여유</button><button type="button" data-v="3">보통</button><button type="button" data-v="4">강함</button><button type="button" data-v="5">매우 강함</button></div></div><div class="wo-savebar"><button type="button" class="btn btn-ghost" id="saveDraftBtn">임시저장</button><button type="submit" class="btn btn-primary">운동 완료</button></div></form></div>
<div class="wo-modal" id="inbodyModal" hidden><form class="wo-sheet" id="inbodyForm"><div class="wo-sheet-head"><b>내 데이터</b><button type="button" data-close>×</button></div><p style="font-size:11px;color:var(--muted);margin-bottom:10px">최근 인바디 결과가 있을 때만 입력하세요. 운동량 점수를 과장하는 배수로 사용하지 않습니다.</p><div class="inbody-row"><input type="date" id="ibDate" required><input type="number" step="0.1" id="ibWeight" placeholder="체중 kg"><input type="number" step="0.1" id="ibMuscle" placeholder="골격근량 kg"><input type="number" step="0.1" id="ibFat" placeholder="체지방률 %"><button class="btn btn-primary btn-sm">저장</button></div><div id="inbodyHistory" style="margin-top:12px"></div></form></div>
<script type="module" src="js/workout.js"></script><script src="register-sw.js"></script></body></html>
