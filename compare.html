<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <title>우리 그래프 | 마웨그</title>
  <meta property="og:title" content="우리 그래프 | 마웨그">
  <meta property="og:description" content="여러 사용자의 체중 그래프를 한눈에 비교해 보세요.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://woojehong.github.io/myweightgraph/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/borders.css">
  <link rel="stylesheet" href="css/avatar-v2.css">
  <link rel="stylesheet" href="css/showroom-card-themes.css?v=2">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <style>
    @media(min-width:768px){ .page { max-width: 100% !important; padding-left: 8px !important; padding-right: 8px !important; } }

    /* ── 선택 바 ───────────────────────────────────────────────── */
    .compare-bar{
      position:sticky; top:0; z-index:90;
      background:var(--bg); padding:10px 0 8px;
      border-bottom:1px solid var(--border);
    }
    /* 일간/주간/월간 토글 (우측 상단 · 전체 공통 적용) */
    .gran-row{ display:flex; gap:4px; justify-content:flex-end; margin-bottom:8px; }
    .gran-btn{
      padding:5px 12px; border-radius:16px; font-size:12px; font-weight:700;
      background:var(--surface2); border:1px solid var(--border); color:var(--muted); transition:all .15s;
    }
    .gran-btn:hover{ color:var(--text); }
    .gran-btn.active{ background:rgba(0,229,170,.14); border-color:var(--teal); color:var(--teal); }
    @media(max-width:767px){ .gran-btn{ padding:4px 10px; font-size:11px; } }
    .subgraph-toggles{display:flex;justify-content:flex-end;gap:7px;margin:-2px 0 7px}
    .subgraph-toggle{display:flex;align-items:center;gap:6px;min-height:32px;padding:5px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
    .subgraph-toggle:focus-within{outline:2px solid var(--teal);outline-offset:2px}
    .subgraph-toggle input{width:16px;height:16px;margin:0;accent-color:var(--teal)}
    .subgraph-toggle:has(input:checked){border-color:var(--teal);color:var(--teal);background:rgba(0,229,170,.1)}
    .marker-size-control{display:flex;align-items:center;gap:7px;min-height:32px;padding:4px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:700}
    .marker-size-control input{width:96px;accent-color:var(--teal)}
    .marker-size-control output{min-width:34px;color:var(--teal);font-variant-numeric:tabular-nums;text-align:right}
    @media(max-width:520px){.subgraph-toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.subgraph-toggle{justify-content:center;padding-inline:7px}.marker-size-control{grid-column:1/-1;justify-content:center}.marker-size-control input{min-width:120px;max-width:190px;flex:1}}

    .picker{
      /* Horizontal scrolling creates a vertical clipping boundary too. Keep a
         generous inner gutter so animated borders/glows never hit that edge. */
      display:flex; gap:8px; overflow-x:auto; padding:28px 26px 10px;
      scroll-padding-inline:26px;
      -webkit-overflow-scrolling:touch; scrollbar-width:thin;
    }
    .pick-chip{
      flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:4px;
      background:transparent; border:none; padding:2px; position:relative; width:56px;
    }
    .pick-chip .pick-name{
      font-size:10px; color:var(--muted); max-width:54px; overflow:hidden;
      text-overflow:ellipsis; white-space:nowrap; text-align:center;
    }
    .pick-chip.sel .pick-name{ color:var(--teal); font-weight:700; }
    .pick-avatar{ width:42px; height:42px; opacity:.65; transition:opacity .15s; }
    .pick-chip.sel .pick-avatar{ opacity:1; }
    .pick-avatar-inner{
      width:34px; height:34px; border-radius:50%; background:#0d1117;
      display:flex; align-items:center; justify-content:center; font-size:18px;
      position:relative; z-index:1;
    }
    .pick-num{
      position:absolute; top:-2px; right:4px; z-index:5;
      width:18px; height:18px; border-radius:50%;
      background:var(--teal); color:#0d1117; font-size:11px; font-weight:800;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 0 2px var(--bg);
    }

    /* ── 그래프 그리드 (열 수는 JS가 인원수에 맞춰 자동 설정) ───── */
    .compare-grid{ display:grid; gap:12px; margin-top:14px; grid-template-columns:1fr; }

    .cmp-cell{
      background:var(--surface); border:1px solid var(--border);
      border-radius:12px; padding:10px 2px 4px; min-width:0;
    }
    .cmp-cell canvas{ display:block; }
    .cmp-chart{ position:relative; width:100%; }
    .cmp-content{display:grid;grid-template-columns:minmax(0,1fr) 88px;align-items:stretch;min-width:0}
    .cmp-content.avatar-hidden{grid-template-columns:minmax(0,1fr)}
    .cmp-content.avatar-hidden .cmp-avatar-stage{display:none}
    .cmp-avatar-stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-left:1px solid rgba(255,255,255,.07);background:radial-gradient(ellipse at 50% 50%,rgba(0,229,170,.1),transparent 68%);cursor:pointer}
    .cmp-avatar-stage .avatar-v2{width:82px;height:164px;max-width:100%}
    .cmp-avatar-stage::after{content:'▶';position:absolute;right:5px;bottom:5px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(8,13,20,.8);border:1px solid rgba(255,255,255,.14);color:var(--muted);font-size:8px;z-index:5}
    .cmp-empty{
      display:flex; align-items:center; justify-content:center;
      min-height:120px; color:var(--muted); font-size:12px;
    }
    .grid-empty{
      grid-column:1/-1; text-align:center; color:var(--muted);
      font-size:13px; padding:48px 16px;
    }

    /* ── 미니 프로필 (데스크탑 기본) ───────────────────────────── */
    .cmp-profile{display:grid;grid-template-columns:132px minmax(0,1fr) minmax(300px,.95fr);grid-template-rows:auto minmax(60px,1fr);column-gap:16px;row-gap:6px;aspect-ratio:4.2/1;min-height:160px;max-height:166px;overflow:hidden;margin-bottom:8px;padding:12px 14px}
    .cmp-avatar{width:132px;height:132px;grid-column:1;grid-row:1/3;align-self:center}
    .cmp-avatar-inner{
      width:26px; height:26px; border-radius:50%; background:#0d1117;
      display:flex; align-items:center; justify-content:center;
      font-size:15px; position:relative; z-index:1; overflow:hidden;
    }
    .cmp-info{grid-column:2;grid-row:1;display:flex;overflow:hidden;flex-direction:column;align-items:flex-start;justify-content:start;gap:4px;line-height:1.2;min-width:0;padding-top:3px}
    .cmp-title{ font-size:11px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
    .cmp-name{ font-size:17px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
    .cmp-message-panel{grid-column:2;grid-row:2;min-width:0;display:flex;flex-direction:column;gap:3px;padding:5px 0;border:0;background:transparent;border-radius:0}
    .cmp-message{margin:0;color:rgba(255,255,255,.78);font-size:10px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
    .cmp-message-input{width:100%;min-height:34px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:10px;line-height:1.45;padding:0}
    .cmp-message-actions{display:flex;justify-content:flex-end;gap:5px;margin-top:auto}
    .cmp-message-actions button{padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);font-size:8px}
    .cmp-message-actions .save{border-color:rgba(0,229,170,.45);color:var(--teal)}
    .cmp-score{ display:none; }

    /* ── 최고/최저/현재 배지 (프로필 줄 오른쪽 정렬) ───────────── */
    .cmp-trophies{grid-column:3;grid-row:1;display:grid;grid-template-columns:repeat(7,34px);grid-template-rows:repeat(2,34px);grid-auto-flow:row;direction:rtl;justify-content:right;justify-self:stretch;justify-items:center;align-content:start;gap:4px 5px;max-height:72px;overflow:hidden}
    .cmp-trophies:empty{display:none!important}
    .cmp-trophies .v3-trophy-image{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 3px 4px #000b)}
    .cmp-markers{grid-column:3;grid-row:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;min-width:0}
    .cmp-profile[data-card-theme] .cmp-markers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;width:100%;min-width:100%;justify-self:stretch!important;margin:0;padding:0;border:0;background:transparent;box-shadow:none}
    .cmp-profile[data-card-theme] .cmp-markers .mk{width:100%;min-width:0!important;min-height:60px;padding:7px 8px;border:1px solid rgba(255,255,255,.14);border-radius:9px;box-sizing:border-box}
    .cmp-profile[data-card-theme] .cmp-markers .mk-max{background:rgba(195,65,42,.92)!important}.cmp-profile[data-card-theme] .cmp-markers .mk-min{background:rgba(34,128,50,.92)!important}.cmp-profile[data-card-theme] .cmp-markers .mk-cur{background:rgba(20,98,152,.92)!important}
    .mk{
      display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;
      min-height:62px;padding:6px 8px;border-radius:9px;white-space:nowrap;text-align:center;
    }
    .mk b{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:800;color:#fff}
    .mk b em{font-size:9px;font-style:normal;font-weight:700;color:rgba(255,255,255,.78)}
    .mk span{ font-size:9px; color:rgba(255,255,255,.78); margin-top:1px; }
    .mk-max{ background:rgba(195,65,42,.92); }
    .mk-min{ background:rgba(34,128,50,.92); }
    .mk-cur{ background:rgba(20,98,152,.92); }
    .cmp-graph-only-name{padding:3px 8px 7px;color:var(--text);font-size:12px;font-weight:800}

    /* ── 모바일: 미니 프로필 2배 축소 (아이콘·텍스트 간격 확보) ── */
    @media(max-width:767px){
      .cmp-profile{grid-template-columns:64px minmax(0,1fr);grid-template-rows:auto auto auto auto;min-height:0;margin-bottom:6px;padding:8px;gap:7px}
      .cmp-avatar{width:64px;height:64px;grid-column:1;grid-row:1/3}
      .cmp-avatar-inner{ width:14px; height:14px; font-size:9px; }
      .cmp-info{grid-column:2;grid-row:1}
      .cmp-message-panel{grid-column:1/3;grid-row:3}
      .cmp-trophies{grid-column:2;grid-row:2}
      .cmp-markers{grid-column:1/3;grid-row:4}
      .cmp-title{ font-size:8px; }
      .cmp-name{ font-size:11px; }
      .cmp-message,.cmp-message-input{font-size:8px}
      .cmp-score{ font-size:7px; }
      .cmp-markers{gap:4px}
      .mk{min-height:48px;padding:4px;border-radius:6px}
      .mk b{ font-size:9px; }
      .mk span{ font-size:7px; }
      .cmp-content{grid-template-columns:minmax(0,1fr) 58px}
      .cmp-avatar-stage .avatar-v2{width:55px;height:112px}
    }

    /* ── 모바일: 헤더 심플화 (프로필·미입력 숨김) ─────────────── */
    @media(max-width:767px){
      body.compare .top-bar{
        flex-direction:row !important; align-items:center !important;
        justify-content:space-between !important; padding:6px 14px !important; gap:8px;
      }
      body.compare .top-bar #todayAlert,
      body.compare .top-bar #userChip{ display:none !important; }
      body.compare .top-bar .mweg-header-wrap{
        order:0 !important; flex:1; align-items:flex-start !important; justify-self:unset !important;
      }
      body.compare .top-bar .mweg-title{ font-size:20px; }
      body.compare .top-bar .mweg-subtitle{ display:none; }
      body.compare .top-bar > div:last-child{
        order:0 !important; width:auto !important; justify-content:flex-end !important;
      }
      body.compare #logoutBtn{
        position:static !important; top:auto !important; right:auto !important;
        display:inline-block !important;
      }
    }

    /*
     * Unified mobile layout
     * Phones, foldables and tablets share one composition. The available
     * width only changes spacing and type scale; it never falls back to the
     * desktop three-column header.
     */
    @media(max-width:1180px){
      body.compare{
        --mobile-page-gutter:clamp(10px,2.2vw,24px);
        --mobile-profile-size:clamp(88px,13vw,128px);
      }
      body.compare .top-bar{
        display:flex!important;
        flex-direction:row!important;
        align-items:center!important;
        justify-content:space-between!important;
        min-height:54px;
        padding:8px var(--mobile-page-gutter)!important;
        gap:10px;
      }
      body.compare .top-bar #todayAlert,
      body.compare .top-bar #userChip{display:none!important}
      body.compare .top-bar .mweg-header-wrap{
        order:0!important;
        flex:1;
        align-items:flex-start!important;
        justify-self:unset!important;
      }
      body.compare .top-bar .mweg-title{font-size:clamp(20px,3vw,25px)}
      body.compare .top-bar .mweg-subtitle{display:none}
      body.compare .top-bar>div:last-child{
        order:0!important;
        width:auto!important;
        justify-content:flex-end!important;
      }
      body.compare #logoutBtn{
        position:static!important;
        display:inline-flex!important;
        min-height:34px;
        padding:6px 12px!important;
        font-size:11px!important;
      }
      body.compare .page{
        width:100%;
        max-width:100%!important;
        padding:10px var(--mobile-page-gutter) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px)!important;
      }
      body.compare .compare-bar{
        position:relative;
        top:auto;
        padding:8px 0 10px;
        background:var(--bg);
      }
      body.compare .gran-row{
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:7px;
        margin:0 0 8px;
      }
      body.compare #avToggle{display:none!important}
      body.compare .gran-btn{
        width:100%;
        min-height:38px;
        padding:7px 10px;
        border-radius:10px;
        font-size:12px;
      }
      body.compare .subgraph-toggles{
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:7px;
        margin:0;
      }
      body.compare .subgraph-toggle{
        justify-content:center;
        min-width:0;
        min-height:42px;
        padding:7px 8px;
        font-size:11px;
        white-space:nowrap;
      }
      body.compare .marker-size-control{
        grid-column:1/-1;
        justify-content:center;
        min-height:42px;
        padding:7px 12px;
      }
      body.compare .marker-size-control input{
        width:min(52vw,360px);
        max-width:100%;
      }
      body.compare .picker{
        display:grid;
        grid-template-columns:repeat(5,minmax(0,1fr));
        gap:6px;
        overflow:visible;
        padding:16px 0 8px;
        scroll-padding:0;
      }
      body.compare .pick-chip{
        width:100%;
        min-width:0;
        padding:4px 2px;
      }
      body.compare .pick-chip .pick-name{
        width:100%;
        max-width:none;
        font-size:10px;
      }
      body.compare .pick-avatar{width:44px;height:44px}
      body.compare .pick-num{right:calc(50% - 28px)}
      body.compare .compare-grid{
        gap:10px;
        margin-top:10px;
        margin-left:auto;
        margin-right:auto;
      }
      body.compare .cmp-cell{
        border-radius:12px;
        padding:8px 3px 4px;
      }
      body.compare .cmp-profile,
      body.compare .cmp-profile[data-card-theme]{
        display:grid;
        grid-template-columns:var(--mobile-profile-size) minmax(0,1fr);
        grid-template-rows:auto minmax(62px,auto) auto auto;
        column-gap:clamp(10px,2vw,18px);
        row-gap:7px;
        min-height:0;
        max-height:none;
        aspect-ratio:auto;
        margin-bottom:7px;
        padding:clamp(12px,2vw,18px)!important;
        overflow:hidden;
      }
      body.compare .cmp-avatar{
        width:var(--mobile-profile-size);
        height:var(--mobile-profile-size);
        grid-column:1;
        grid-row:1/3;
        align-self:start;
      }
      body.compare .cmp-info,
      body.compare .cmp-profile[data-card-theme] .cmp-info{
        grid-column:2!important;
        grid-row:1!important;
        align-self:start!important;
        gap:3px;
        margin:0!important;
        padding:2px 0 0!important;
      }
      body.compare .cmp-title{font-size:clamp(9px,1.25vw,12px)}
      body.compare .cmp-name{font-size:clamp(14px,2vw,19px)}
      body.compare .cmp-message-panel,
      body.compare .cmp-profile[data-card-theme] .cmp-message-panel{
        grid-column:2!important;
        grid-row:2!important;
        align-self:stretch!important;
        min-height:0;
        margin:0!important;
        padding:5px 0 0!important;
        gap:5px;
      }
      body.compare .cmp-message,
      body.compare .cmp-message-input{
        font-size:clamp(9px,1.2vw,11px);
        line-height:1.45;
      }
      body.compare .cmp-message-input{
        min-height:38px;
        padding:3px 0;
        border-bottom:1px solid rgba(255,255,255,.13);
      }
      body.compare .cmp-message-input:focus{
        border-bottom-color:var(--teal);
      }
      body.compare .cmp-message-actions{
        justify-content:flex-start;
        margin-top:0;
      }
      body.compare .cmp-message-actions button{
        min-height:28px;
        padding:4px 10px;
        font-size:9px;
      }
      body.compare .cmp-trophies,
      body.compare .cmp-profile[data-card-theme] .cmp-trophies{
        grid-column:1/-1!important;
        grid-row:3!important;
        width:100%;
        height:auto;
        min-height:0;
        max-height:68px;
        grid-template-columns:repeat(7,30px);
        grid-template-rows:repeat(2,30px);
        justify-content:end;
        align-content:start;
        gap:4px;
        padding:0!important;
      }
      body.compare .cmp-trophies:empty{display:none!important}
      body.compare .cmp-profile[data-card-theme] .cmp-trophies .v3-trophy-image{
        width:30px!important;
        height:30px!important;
      }
      body.compare .cmp-markers,
      body.compare .cmp-profile[data-card-theme] .cmp-markers{
        grid-column:1/-1!important;
        grid-row:4!important;
        grid-template-columns:repeat(3,minmax(0,1fr))!important;
        width:100%;
        min-width:0;
        align-items:stretch;
        gap:clamp(5px,1.3vw,10px)!important;
      }
      body.compare .cmp-profile[data-card-theme] .cmp-markers .mk,
      body.compare .cmp-markers .mk{
        width:100%;
        min-width:0!important;
        min-height:clamp(58px,9vw,82px)!important;
        padding:7px 6px!important;
      }
      body.compare .mk b{font-size:clamp(10px,1.45vw,14px)}
      body.compare .mk b em,
      body.compare .mk span{font-size:clamp(7px,1vw,10px)}
      body.compare .cmp-content{grid-template-columns:minmax(0,1fr)}
      body.compare .cmp-chart{
        width:100%;
        min-width:0;
        overflow:hidden;
      }
      body.compare .bottom-nav{
        height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
        padding-bottom:env(safe-area-inset-bottom,0px);
      }
    }

    @media(min-width:768px) and (max-width:1024px){
      body.compare{
        --mobile-page-gutter:clamp(16px,2.4vw,24px);
        --mobile-profile-size:clamp(106px,13vw,126px);
      }
      body.compare .compare-bar{padding-top:10px}
      body.compare .picker{padding-top:18px}
      body.compare .cmp-profile,
      body.compare .cmp-profile[data-card-theme]{
        column-gap:18px;
        row-gap:8px;
      }
      body.compare .cmp-message-input{min-height:44px}
    }

    @media(min-width:1025px) and (max-width:1180px){
      body.compare{
        --mobile-page-gutter:24px;
        --mobile-profile-size:128px;
      }
      body.compare .gran-row,
      body.compare .subgraph-toggles{
        max-width:920px;
        margin-left:auto;
        margin-right:auto;
      }
      body.compare .picker{
        max-width:920px;
        margin-inline:auto;
      }
      body.compare .cmp-profile,
      body.compare .cmp-profile[data-card-theme]{
        padding:18px 20px!important;
        column-gap:20px;
      }
      body.compare .compare-grid{max-width:1080px}
      body.compare .cmp-title{font-size:12px}
      body.compare .cmp-name{font-size:19px}
      body.compare .cmp-message,
      body.compare .cmp-message-input{font-size:11px}
    }

    @media(max-width:560px){
      body.compare{
        --mobile-page-gutter:8px;
        --mobile-profile-size:82px;
      }
      body.compare .subgraph-toggles{grid-template-columns:repeat(2,minmax(0,1fr))}
      body.compare .subgraph-toggle:has(#graphOnlyToggle){grid-column:1/-1}
      body.compare .picker{gap:2px;padding-top:12px}
      body.compare .pick-avatar{width:38px;height:38px}
      body.compare .pick-num{right:calc(50% - 24px)}
      body.compare .cmp-profile,
      body.compare .cmp-profile[data-card-theme]{
        column-gap:12px;
        padding:10px!important;
      }
      body.compare .cmp-message-actions button{min-height:26px}
      body.compare .cmp-trophies,
      body.compare .cmp-profile[data-card-theme] .cmp-trophies{
        grid-template-columns:repeat(7,24px);
        grid-template-rows:repeat(2,24px);
        max-height:54px;
      }
      body.compare .cmp-profile[data-card-theme] .cmp-trophies .v3-trophy-image{
        width:24px!important;
        height:24px!important;
      }
    }
  </style>
</head>
<body class="compare">
<header class="top-bar">
  <div id="todayAlert" style="min-width:0"></div>
  <a href="index.html?select=1" class="mweg-header-wrap" style="justify-self:center"><span class="mweg-title">마웨그</span><span class="mweg-subtitle">My Weight Graph</span></a>
  <div style="display:flex;align-items:center;gap:8px;justify-content:flex-end">
    <div class="user-chip" id="userChip" style="cursor:default">
      <div id="chipAvatarWrap" class="avatar-frame chip-avatar">
        <div class="chip-avatar-inner"><span id="chipEmoji">⚖️</span></div>
      </div>
      <div class="chip-info">
        <span id="chipTitle" class="chip-title"></span>
        <span id="chipName" class="chip-name">-</span>
        <span id="chipScore" class="chip-score"></span>
      </div>
    </div>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" style="display:none" onclick="doLogout()">로그아웃</button>
  </div>
</header>

<div class="page">
  <div class="compare-bar">
    <div class="gran-row">
      <button class="gran-btn" id="avToggle" type="button" onclick="toggleAvatars()" style="margin-right:auto">🧍 아바타</button>
      <button class="gran-btn active" data-m="day"   onclick="setViewMode('day')">일간</button>
      <button class="gran-btn"        data-m="week"  onclick="setViewMode('week')">주간</button>
      <button class="gran-btn"        data-m="month" onclick="setViewMode('month')">월간</button>
    </div>
    <div class="subgraph-toggles" aria-label="보조 그래프 표시 설정">
      <label class="subgraph-toggle" for="dietToggle"><input id="dietToggle" type="checkbox">식단 표시</label>
      <label class="subgraph-toggle" for="exerciseToggle"><input id="exerciseToggle" type="checkbox">운동 표시</label>
      <label class="subgraph-toggle" for="graphOnlyToggle"><input id="graphOnlyToggle" type="checkbox">그래프만 표시</label>
      <label class="marker-size-control" for="markerSize"><span>마커 크기</span><input id="markerSize" type="range" min="20" max="100" step="2" value="32"><output id="markerSizeValue" for="markerSize">32px</output></label>
    </div>
    <div class="picker" id="picker">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <div class="compare-grid" id="compareGrid"></div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>
<div class="toast" id="toast"></div>

<script type="module">
import { getUser, getUsers, getWeights, getSettings, getTierSettings, updateUser } from './js/db.js';
import { isAuthed, clearAuth } from './js/auth.js';
import { renderChart, aggregateRecords, periodLabel } from './js/chart-render.js';
import { getTierForScore, DEFAULT_TIERS } from './js/achievements.js';
import { esc } from './js/util.js';
import { applyCardV2, decorateMainPlotV2, getChartDecorationsV2, normalizeLoadoutV2, profileVisualForUserV2, profileShowcaseForUserV2, renderTrophyV2, titleInfoV2 } from './js/showroom-v2.js?v=96';
import { activeTodayMessage, normalizeTodayMessage, todayMessageDayKey } from './js/today-message.js';

const uid = new URLSearchParams(location.search).get('user') || localStorage.getItem('uid');
if (!uid) location.href = 'index.html';

window.doLogout = () => { clearAuth(); localStorage.removeItem('uid'); location.href = 'index.html'; };

// ── 하단 네비 ─────────────────────────────────────────────────────────
function buildNav() {
  const links = [
    { href:`input.html?user=${uid}`,        icon:'✏️', label:'데이터 입력', id:'input' },
    { href:`dashboard.html?user=${uid}`,    icon:'📊', label:'내 그래프',   id:'dashboard' },
    { href:`compare.html?user=${uid}`,      icon:'👥', label:'우리 그래프', id:'compare' },
    { href:`achievements.html?user=${uid}`, icon:'🏆', label:'업적',         id:'achievements' },
    { href:`dressroom.html?user=${uid}`,    icon:'✨', label:'쇼룸',         id:'dressroom' },
  ];
  const nav = document.getElementById('bottomNav');
  links.forEach(l => {
    const a = document.createElement('a');
    a.href = l.href; a.className = l.id === 'compare' ? 'active' : '';
    a.innerHTML = `<span class="icon">${l.icon}</span>${l.label}`;
    nav.appendChild(a);
  });
}

let allUsers = [], TIERS = DEFAULT_TIERS, S = {}, curUser = null;
let selected = [];       // 선택된 uid 배열 (표시 순서 유지)
const weightsCache = {}; // uid -> records

// 일간/주간/월간 — 항상 '일간'으로 시작 (새로고침 시 초기화, 저장 안 함)
let viewMode = 'day';
let showAvatars = localStorage.getItem('compare_show_avatars_v2') !== '0';
let showDietGraph = localStorage.getItem('compare_show_diet') === 'true';
let showExerciseGraph = localStorage.getItem('compare_show_exercise') === 'true';
let graphOnlyMode = false;
const storedMarkerSize=Number(localStorage.getItem('compare_marker_size'));
let markerSize=Number.isFinite(storedMarkerSize)&&storedMarkerSize>=20&&storedMarkerSize<=100?Math.round(storedMarkerSize/2)*2:32;
function syncAvatarToggle(){document.getElementById('avToggle')?.classList.toggle('active',showAvatars)}
window.toggleAvatars=()=>{showAvatars=!showAvatars;try{localStorage.setItem('compare_show_avatars_v2',showAvatars?'1':'0')}catch(e){}syncAvatarToggle();renderGrid()};
function persistSubgraphToggle(key,enabled){try{enabled?localStorage.setItem(key,'true'):localStorage.removeItem(key)}catch(e){}}
function bindSubgraphToggles(){
  const diet=document.getElementById('dietToggle'),exercise=document.getElementById('exerciseToggle'),graphOnly=document.getElementById('graphOnlyToggle'),size=document.getElementById('markerSize'),sizeValue=document.getElementById('markerSizeValue');
  diet.checked=showDietGraph;exercise.checked=showExerciseGraph;
  graphOnly.checked=false;
  size.value=String(markerSize);sizeValue.value=`${markerSize}px`;
  diet.addEventListener('change',()=>{showDietGraph=diet.checked;persistSubgraphToggle('compare_show_diet',showDietGraph);renderGrid()});
  exercise.addEventListener('change',()=>{showExerciseGraph=exercise.checked;persistSubgraphToggle('compare_show_exercise',showExerciseGraph);renderGrid()});
  graphOnly.addEventListener('change',()=>{graphOnlyMode=graphOnly.checked;renderGrid()});
  size.addEventListener('input',()=>{sizeValue.value=`${size.value}px`});
  size.addEventListener('change',()=>{markerSize=Number(size.value);try{localStorage.setItem('compare_marker_size',String(markerSize))}catch(e){}renderGrid()});
}
window.setViewMode = m => {
  if (viewMode === m) return;
  viewMode = m;
  document.querySelectorAll('.gran-btn').forEach(x => { if (x.dataset.m) x.classList.toggle('active', x.dataset.m === m); });
  renderGrid();
};

const STORAGE_KEY = 'compare_selected_uids';
function loadSelected() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : null;
  } catch (e) { return null; }
}
function saveSelected() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(selected)); } catch (e) {}
}

// 우리 그래프 차트 옵션: 메인 체중 + 사용자가 켠 식단/운동만 (주간막대 제외).
// 최고/최저/현재는 점만 찍고(말풍선·리더선 없음) 값은 프로필 줄 배지로 표시.
// gridCell=true → 칸 너비에 맞춰 그래프가 좌우/상하로 꽉 차도록 종횡비·여백 계산.
function chartOpts(user) {
  const base = {
    ...S,
    showWeeklyBar: false,
    showDietGraph,
    showExerciseGraph,
    showMaxMarker: false,
    showMinMarker: true,
    showCurMarker: false,
    gridCell: true,
    labelMode: viewMode,
    mainPlotAspectRatio: 16 / 9,
    chartDecorations: { ...getChartDecorationsV2(user?.showroomLoadoutV2), markerSize },
  };
  // 주간·월간은 평균선만 (식단/운동·이동평균·예상 숨김)
  if (viewMode !== 'day') {
    return { ...base, showDietGraph:false, showExerciseGraph:false, show7dayMA:false, showPrediction:false };
  }
  return base;
}

// 열 개수: 모바일은 항상 1열(1명씩 세로), 데스크탑은 한 줄에 최대 2명.
function gridCols(n) {
  const desktop = window.matchMedia('(min-width:1181px)').matches;
  return desktop ? (n <= 1 ? 1 : 2) : 1;
}

// 최고/최저/현재 값·날짜 산출 (배지 표시용)
function markerStats(records) {
  const pts = records.filter(r => r.weight != null).sort((a, b) => a.date.localeCompare(b.date));
  if (!pts.length) return null;
  const ws = pts.map(p => p.weight);
  const maxW = Math.max(...ws), minW = Math.min(...ws);
  const maxP = pts.find(p => p.weight === maxW);
  let minP = pts[0];
  for (let i = pts.length - 1; i >= 0; i--) { if (pts[i].weight === minW) { minP = pts[i]; break; } }
  const curP = pts[pts.length - 1];
  return {
    maxW, maxDate: maxP.date,
    minW, minDate: minP.date,
    curW: curP.weight, curDate: curP.date,
  };
}

// 일간=YY.MM.DD, 주간=0000년 0월 0주차, 월간=0000년 0월
const shortDate = ds => {
  if (viewMode !== 'day') return periodLabel(ds, viewMode);
  const [y, m, d] = ds.split('-');
  return `${y.slice(2)}.${m}.${d}`;
};

function setChip(u) {
  const tier = getTierForScore(u?.totalScore || 0, TIERS);
  const tc = tier.color || '#00e5aa';
  document.getElementById('chipEmoji').innerHTML = profileVisualForUserV2(u,30);
  document.getElementById('chipName').textContent  = u?.name || '-';
  document.getElementById('chipName').style.color  = tc;
  const wrap = document.getElementById('chipAvatarWrap');
  wrap.className = 'chip-avatar';
  wrap.style.setProperty('--tier-color', tc);
  const titleEl = document.getElementById('chipTitle');
  const title=titleInfoV2(u?.showroomLoadoutV2);titleEl.textContent=title?.name||'';titleEl.style.color=title?.color||tc;titleEl.style.display=title?'inline':'none';
  const scoreEl = document.getElementById('chipScore');
  scoreEl.textContent = (u?.totalScore > 0) ? `${u.totalScore} PT` : '';
}

// ── 유저 선택 피커 ────────────────────────────────────────────────────
function renderPicker() {
  const el = document.getElementById('picker');
  el.innerHTML = allUsers.map(u => {
    const tier = getTierForScore(u.totalScore || 0, TIERS);
    const tc = tier.color;
    const idx = selected.indexOf(u.id);
    const sel = idx >= 0;
    const title=titleInfoV2(u.showroomLoadoutV2);
    return `
      <button class="pick-chip ${sel ? 'sel' : ''}" data-id="${u.id}">
        ${sel ? `<span class="pick-num">${idx + 1}</span>` : ''}
        <div class="pick-avatar">${profileVisualForUserV2(u,40)}</div>
        <span class="pick-name">${esc(u.name)}</span>
      </button>`;
  }).join('');
  el.querySelectorAll('.pick-chip').forEach(btn => {
    btn.addEventListener('click', () => togglePick(btn.dataset.id));
  });
}

function togglePick(id) {
  const i = selected.indexOf(id);
  if (i >= 0) selected.splice(i, 1);
  else selected.push(id);
  saveSelected();
  renderPicker();
  renderGrid();
}

// ── 그래프 그리드 ─────────────────────────────────────────────────────
function destroyGridCharts() {
  document.querySelectorAll('#compareGrid canvas').forEach(c => {
    if (c._chartInstance) { try { c._chartInstance.destroy(); } catch (e) {} }
  });
}

function cellHTML(u) {
  const tier = getTierForScore(u.totalScore || 0, TIERS);
  const tc = tier.color;
  const title=titleInfoV2(u.showroomLoadoutV2);
  const todayMessage=activeTodayMessage(u);
  const isMine=u.id===uid;
  const trophies=normalizeLoadoutV2(u.showroomLoadoutV2).trophy;
  const recs = aggregateRecords(weightsCache[u.id] || [], viewMode);
  const hasData = recs.filter(r => r.weight != null).length >= 2;
  const body = hasData
    ? `<div class="cmp-chart" data-main-weight-plot="true" data-chart-subgraphs="diet exercise"><canvas id="cv_${u.id}"></canvas></div>`
    : `<div class="cmp-empty">데이터가 부족해요</div>`;

  // 최고(빨강)/최저(초록)/현재(파랑) 배지 — 프로필 줄 오른쪽
  const m = markerStats(recs);
  const badge = (cls, label, w, date) => `
    <div class="mk ${cls}">
      <b><em>${label}</em>${w.toFixed(1)}kg</b>
      <span>${shortDate(date)}</span>
    </div>`;
  const markers = m ? `
    <div class="cmp-markers">
      ${badge('mk-max', '최고', m.maxW, m.maxDate)}
      ${badge('mk-min', '최저', m.minW, m.minDate)}
      ${badge('mk-cur', '현재', m.curW, m.curDate)}
    </div>` : '';

  // 사용자 프로필 이모지
  return `
    <div class="cmp-cell ${graphOnlyMode?'graph-only':''}">
      ${graphOnlyMode?`<div class="cmp-graph-only-name">${esc(u.name)}</div>`:`
      <div class="cmp-profile">
        <div class="cmp-avatar">${profileShowcaseForUserV2(u,132)}</div>
        <div class="cmp-info">
          ${title ? `<span class="cmp-title" style="color:${title.color}">${esc(title.name)}</span>` : ''}
          <span class="cmp-name" style="color:${tc}">${esc(u.name)}</span>
        </div>
        ${isMine||todayMessage?`<div class="cmp-message-panel">${isMine?`<textarea class="cmp-message-input" data-today-message maxlength="160" placeholder="오늘의 한마디를 입력해보세요">${esc(todayMessage)}</textarea><div class="cmp-message-actions"><button data-message-reset>초기화</button><button class="save" data-message-save>저장</button></div>`:`<p class="cmp-message">${esc(todayMessage)}</p>`}</div>`:''}
        <div class="cmp-trophies">${trophies.map(renderTrophyV2).join('')}</div>
        ${markers}
      </div>`}
      <div class="cmp-content avatar-hidden">${body}</div>
    </div>`;
}

async function renderGrid() {
  const grid = document.getElementById('compareGrid');
  destroyGridCharts();

  if (!selected.length) {
    grid.style.gridTemplateColumns = '1fr';
    grid.innerHTML = `<div class="grid-empty">위에서 사용자를 선택하면<br>그래프를 한눈에 비교할 수 있어요.</div>`;
    return;
  }

  grid.style.gridTemplateColumns = `repeat(${gridCols(selected.length)}, 1fr)`;

  // 선택된 유저들의 기록 병렬 로드 (캐시)
  await Promise.all(selected.map(async id => {
    if (!weightsCache[id]) weightsCache[id] = await getWeights(id).catch(() => []);
  }));

  const users = selected.map(id => allUsers.find(u => u.id === id)).filter(Boolean);
  grid.innerHTML = users.map(cellHTML).join('');
  [...grid.querySelectorAll('.cmp-cell')].forEach((cell,index) => {const u=users[index];if(!graphOnlyMode)applyCardV2(cell,u?.showroomLoadoutV2);const plot=cell.querySelector('[data-main-weight-plot="true"]');if(plot)decorateMainPlotV2(plot,u?.showroomLoadoutV2)});
  const mine=grid.querySelector('.cmp-cell textarea[data-today-message]');
  grid.querySelector('[data-message-save]')?.addEventListener('click',()=>saveMessage(mine?.value||''));
  grid.querySelector('[data-message-reset]')?.addEventListener('click',()=>saveMessage(''));

  // 캔버스가 DOM에 들어간 뒤 차트 렌더
  users.forEach(u => {
    const cv = document.getElementById('cv_' + u.id);
    const recs = aggregateRecords(weightsCache[u.id] || [], viewMode);
    if (cv && recs.filter(r => r.weight != null).length >= 2) {
      try {
        renderChart(recs, u, cv, null, chartOpts(u));
      }
      catch (e) { console.warn('renderChart failed for', u.id, e); }
    }
  });
}

async function saveMessage(raw){
  const todayMessage=normalizeTodayMessage(raw);
  const todayMessageDay=todayMessage?todayMessageDayKey():null;
  try{
    await updateUser(uid,{todayMessage,todayMessageDay});
    allUsers=allUsers.map(user=>user.id===uid?{...user,todayMessage,todayMessageDay}:user);
    curUser={...curUser,todayMessage,todayMessageDay};
    showToast(todayMessage?'오늘의 한마디를 저장했습니다.':'오늘의 한마디를 초기화했습니다.');
    renderGrid();
  }catch(error){showToast(error.message||'저장하지 못했습니다.','err')}
}

// 창 크기 변경 시 종횡비 재계산 위해 재렌더 (디바운스)
let _rzT = null;
window.addEventListener('resize', () => {
  clearTimeout(_rzT);
  _rzT = setTimeout(renderGrid, 250);
});

// ── 토스트 ────────────────────────────────────────────────────────────
function showToast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 2200);
}

// ── 초기화 ────────────────────────────────────────────────────────────
async function init() {
  buildNav();
  const [users, tierData] = await Promise.all([
    getUsers(),
    getTierSettings().catch(() => null),
  ]);
  allUsers = users;
  TIERS = tierData?.tiers || DEFAULT_TIERS;

  curUser = users.find(u => u.id === uid) || await getUser(uid);
  if (!curUser) { localStorage.removeItem('uid'); location.href = 'index.html?select=1'; return; }
  S = await getSettings(uid, curUser);

  // 현재 세션 사용자 인증 체크 (다른 유저 그래프는 핀 불필요)
  if (curUser.passwordHash && !isAuthed(uid, curUser.passwordHash)) {
    location.href = `index.html?auth_required=${encodeURIComponent(uid)}`;
    return;
  }

  document.getElementById('logoutBtn').style.display = '';
  setChip(curUser);
  document.title = '우리 그래프 | 마웨그';

  // 선택 복원: 저장된 목록(존재하는 유저만) → 없으면 현재 사용자 기본 선택
  const ids = new Set(users.map(u => u.id));
  const saved = loadSelected();
  if (saved) {
    selected = saved.filter(id => ids.has(id));
  }
  if (!selected.length && ids.has(uid)) {
    selected = [uid];
  }
  saveSelected();

  syncAvatarToggle();
  bindSubgraphToggles();
  renderPicker();
  renderGrid();
}

init().catch(e => {
  document.getElementById('compareGrid').innerHTML =
    `<div class="grid-empty">오류: ${e.message}</div>`;
});
</script>
<script src="register-sw.js"></script>
</body>
</html>
